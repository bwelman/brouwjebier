project:
  type: book

book:
  title: "Brouw je eigen bier"
  subtitle: "Cursus bierbrouwen voor beginners."
  date: today
  date-format: long
  google-analytics: "G-K3JHGJ2XQG"
  site-url: https://brouwjebier.netlify.app/
  chapters:
    - index.qmd
    - voorwoord.qmd
    - part: "Deel 1"
      chapters:
        - over-bier.qmd
        - brouwproces.qmd
        - apparatuur.qmd
        - hygiene.qmd
        - logboek.qmd
        - brouwsel-1.qmd
    - part: "Deel 2"
      chapters:
        - mout.qmd
        - suikers.qmd
        - maischen.qmd
        - water.qmd
        - brouwsel-2.qmd
    - part: "Deel 3"
      chapters:
        - hop.qmd
        - gist.qmd
        - kruiden.qmd
        - rekenen.qmd
        - recepten.qmd
        - brouwsel-3.qmd
    - part: "Deel 4"
      chapters:
        - software.qmd
        - proeven.qmd
        - brouwmethodes.qmd
        - biertypen.qmd
        - brouwsel-4.qmd
  appendices:
    - bkgtabel.qmd
    - gildes.qmd
    - webwinkels.qmd
    - referenties.qmd

  downloads: [pdf, epub]

bibliography: brouwjebier.bib

lang: nl

execute:
  freeze: auto

format:
  html:
    theme:
      - cosmo
      - brouwjebier.scss
    cover-image: resources/cover.png
    fig-width: 6
    fig-asp: 0.618
    code-fold: false
    link-external-icon: false
    link-external-newwindow: true
    callout-appearance: simple
    author-meta: "Ben Welman"
    description-meta: "Leer aan de hand van dit cursusboek hoe je bier kunt brouwen."

  pdf:
    documentclass: scrbook
    classoption: oneside
    include-in-header: latex/preamble.tex
    papersize: a4
    geometry:
      - top=20mm
      - bottom=20mm
      - left=20mm
      - right=20mm
    cite-method: biblatex
    number-sections: true
    links-as-notes: true
    date: \today
    author: [Ben Welman, Douwe Beimin]

  epub:
    html-math-method: mathjax
    css: include/epub-styles.css
    cover-image: resources/cover.png
    author: "Ben Welman"
    creator: "Ben Welman"
    contributor: "Douwe Beimin"
    subject: "Bierbrouwen"
    abstract: "Leer stap voor stap hoe je zelf bier kunt brouwen."
    righTs: "CC BY-NC-SA 4.0"

knitr:
  opts_chunk:
    echo: false
    warning: false
    message: false
    cache: false
