project:
  type: book

book:
  title: "Brouw je Bier"
  subtitle: "Cursus bierbrouwen voor beginners."
  date: today
  date-format: long
  google-analytics: "G-K3JHGJ2XQG"
  site-url: https://brouwjebier.netlify.app/
  chapters:
    - index.qmd
    - voorwoord.qmd
    - part: "Deel 1"
      chapters:
        - over-bier.qmd
        - brouwproces.qmd
        - apparatuur.qmd
        - hygiene.qmd
        - logboek.qmd
        - brouwsel-1.qmd
    - part: "Deel 2"
      chapters:
        - mout.qmd
        - suikers.qmd
        - maischen.qmd
        - water.qmd
        - brouwsel-2.qmd
    - part: "Deel 3"
      chapters:
        - hop.qmd
        - gist.qmd
        - kruiden.qmd
        - rekenen.qmd
        - recepten.qmd
        - brouwsel-3.qmd
    - part: "Deel 4"
      chapters:
        - software.qmd
        - proeven.qmd
        - brouwmethodes.qmd
        - biertypen.qmd
        - brouwsel-4.qmd
  appendices:
    - bkgtabel.qmd
    - gildes.qmd
    - webwinkels.qmd
    - referenties.qmd

  # downloads: [pdf]

bibliography: brouwjebier.bib

lang: nl

execute:
  freeze: auto

format:
  html:
    theme:
      - cosmo
      - brouwjebier.scss
    cover-image: images/cover2.jpg
    fig-width: 6
    fig-asp: 0.618
    code-fold: false
    link-external-icon: false
    link-external-newwindow: true
    callout-appearance: simple
    author-meta: "Ben Welman"
    description-meta: "Leer aan de hand van dit cursusboek hoe je bier kunt brouwen."
